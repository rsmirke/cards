[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# gtk4 0.11 / libadwaita 0.9 / gio 0.22 require Rust 1.92.
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/rsmirke/cards"
publish = false

[workspace.dependencies]
cards-core = { path = "crates/core" }

# UI (app crate only; never in cards-core).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
glib-build-tools = "0.22"

# Errors (cards-core).
thiserror = "2"

# Storage (cards-core). Bundled SQLite: same version everywhere, FTS5 included.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup"] }

# Scheduling (cards-core): the reference FSRS implementation (ADR 0006).
fsrs = "6.6"

# Ids (cards-core): random bits for UUIDv7 (ADR 0008). Already in the tree
# through fsrs -> rand.
getrandom = "0.4"

# Deck name keys (cards-core): Unicode NFC, which std does not provide
# (ADR 0010).
unicode-normalization = "0.1"

# Test-only: temporary directories for filesystem tests.
tempfile = "3"
# Test-only: property-based tests (scheduler replay).
proptest = "1"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Tests may unwrap/expect (see clippy.toml). Elsewhere, `expect()` is only for
# template children and invariants, with an `#[allow]` and a comment saying why.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
