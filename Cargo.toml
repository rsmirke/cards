[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
# gtk4 0.11 / libadwaita 0.9 / gio 0.22 require Rust 1.92.
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/rsmirke/rappel"
publish = false

[workspace.dependencies]
rappel-core = { path = "crates/core" }

# UI (app crate only; never in rappel-core).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
glib-build-tools = "0.22"
# The card editor (SPEC §4.4, ADR 0022): GtkSourceView 5 bindings, same
# gtk-rs release as gtk4 0.11. v5_10 for the built-in Adwaita style schemes.
sourceview5 = { version = "0.11", features = ["v5_10"] }

# Errors (rappel-core).
thiserror = "2"

# Storage (rappel-core). Bundled SQLite: same version everywhere, FTS5 included.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup"] }

# Scheduling (rappel-core): the reference FSRS implementation (ADR 0006).
fsrs = "6.6"

# Ids (rappel-core): random bits for UUIDv7 (ADR 0008). Already in the tree
# through fsrs -> rand.
getrandom = "0.4"

# Deck name keys (rappel-core): Unicode NFC, which std does not provide
# (ADR 0010).
unicode-normalization = "0.1"

# Export / import (rappel-core, ADR 0017): the `.rappel` zip archive. Only
# Deflate through zlib-rs (pure Rust); no encryption, no other codecs.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Export / import (rappel-core): the `cards.json` format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Card content (rappel-core, ADR 0019): CommonMark parser with tables,
# strikethrough and math. No default features: they only add a CLI.
pulldown-cmark = { version = "0.13", default-features = false }

# Test-only: temporary directories for filesystem tests.
tempfile = "3"
# Test-only: property-based tests (scheduler replay).
proptest = "1"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Tests may unwrap/expect (see clippy.toml). Elsewhere, `expect()` is only for
# template children and invariants, with an `#[expect(.., reason = "..")]`.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
# A lint is silenced only with `#[expect(.., reason = "..")]`: the reason is
# required, and the build fails once the lint no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
